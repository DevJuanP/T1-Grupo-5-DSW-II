spring.application.name=ms-riesgo
server.port=8083
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/paygo_riesgo}
spring.datasource.username=root
spring.datasource.password=1234
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.kafka.bootstrap-servers=${KAFKA_BOOT:localhost:9092}
spring.kafka.consumer.group-id=ms-riesgo
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.paygo.riesgo.dto.RecargaMessage
spring.kafka.consumer.properties.spring.json.trusted.packages=com.paygo.riesgo.dto
app.messaging.mode=both
spring.rabbitmq.host=${RABBIT_HOST:localhost}
spring.rabbitmq.port=${RABBIT_PORT:5672}
spring.rabbitmq.username=${RABBIT_USER:guest}
spring.rabbitmq.password=${RABBIT_PASS:guest}
