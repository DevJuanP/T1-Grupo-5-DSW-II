services:

  mysql:
    image: mysql:8.0
    container_name: paygo-mysql
    ports:
      # Puerto host parametrizado como en la guía T1-DAW II ("${DB_PORT}:3306"):
      # si tienes MySQL local en 3306, deja el default 3307 y apunta las apps
      # con DB_URL=jdbc:mysql://localhost:3307/paygo_* (ver README).
      # Para el default clásico: DB_PORT=3306 docker compose up -d
      - "${DB_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "1234"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../infrastructure/mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p1234"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
